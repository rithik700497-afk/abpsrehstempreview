<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Restro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 font-family:'Poppins',sans-serif;
 background:#f5f5f5;
}

/* HERO */
.hero{
 background:linear-gradient(135deg,#ff3b3b,#ff6b6b);
 color:white;
 padding:15px;
 border-radius:0 0 30px 30px;
}

/* TOP */
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.profile{
 background:white;
 color:#ff3b3b;
 width:35px;
 height:35px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
}

.location span{
 font-size:12px;
 opacity:0.8;
}

/* SEARCH */
.search input{
 width:100%;
 padding:12px;
 border:none;
 border-radius:15px;
 margin:10px 0;
 outline:none;
}

/* 🔥 SLIDER */
.slider{
 position:relative;
 overflow:hidden;
 border-radius:20px;
 margin-top:10px;
}

.slides{
 display:flex;
 transition:transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
 will-change: transform; /* 🔥 GPU boost */
}

.slide{
 min-width:100%;
 height:200px; /* FIXED */
 flex-shrink:0;
 background-size:cover;
 background-position:center;
 position:relative;
 display:flex;
 align-items:center;
 transform:translateZ(0);
}

.overlay{
 background:rgba(0,0,0,0.4);
 width:100%;
 height:100%;
 padding:20px;
 color:white;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.overlay h2{ margin:0; font-size:16px; }
.overlay h1{ margin:5px 0; font-size:26px; }

.overlay button{
 background:black;
 color:white;
 border:none;
 padding:8px 14px;
 border-radius:20px;
 width:130px;
}

/* CATEGORY */
.categories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:10px;
 background:#f5f5f5; /* FIX */
}

.cat{
 background:white;
 padding:8px 12px;
 border-radius:15px;
 font-size:13px;
 box-shadow:0 2px 5px rgba(0,0,0,0.1);
 min-width:90px;
 text-align:center;
}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
 padding:15px;
}

/* CARD */
.card{
 background:white;
 border-radius:20px;
 padding:10px;
 box-shadow:0 8px 25px rgba(0,0,0,0.15);
 transition:0.3s;
}
.card:hover{ transform:translateY(-5px); }

.card img{
 width:100%;
 border-radius:15px;
}

.name{ font-size:14px; font-weight:600; }

.info{
 font-size:12px;
 color:gray;
 display:flex;
 justify-content:space-between;
}

.price-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.add{
 background:#ff3b3b;
 color:white;
 border:none;
 width:30px;
 height:30px;
 border-radius:10px;
 font-size:18px;
 transition:0.2s;
}

.add:active{
 transform:scale(0.8);
}

/* CART BAR */
.cart-bar{
 position:fixed;
 bottom:-100px;
 left:10px;
 right:10px;
 background:#ff3b3b;
 color:white;
 padding:14px;
 border-radius:15px;
 display:flex;
 justify-content:space-between;
 transition:0.4s;
 box-shadow:0 10px 30px rgba(255,59,59,0.4);
}

.cart-bar.show{
 bottom:10px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">

<div class="topbar">
<div class="location">
📍 Home <br>
<span>QR Table Ordering System</span>
</div>
<div class="profile">R</div>
</div>

<div class="search">
<input placeholder="Search food...">
</div>

<!-- 🔥 SLIDER -->
<div class="slider">
  <div class="slides" id="slides">

    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092')">
      <div class="overlay">
        <h2>ITEMS AT</h2>
        <h1>50% OFF</h1>
        <button>Order Now →</button>
      </div>
    </div>

    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1551782450-a2132b4ba21d')">
      <div class="overlay">
        <h2>HOT DEAL</h2>
        <h1>BUY 1 GET 1</h1>
        <button>Try Now →</button>
      </div>
    </div>

    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836')">
      <div class="overlay">
        <h2>BREAKFAST</h2>
        <h1>MIN 30% OFF</h1>
        <button>Explore →</button>
      </div>
    </div>

  </div>
</div>

</div> <!-- HERO END -->

<!-- CATEGORY (FIXED POSITION) -->
<div class="categories">
<div class="cat">🍔 Burger</div>
<div class="cat">🍕 Pizza</div>
<div class="cat">🍜 Noodles</div>
<div class="cat">🍗 Biryani</div>
</div>

<!-- FOOD -->
<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800&q=80">
<div class="name">Burger</div>
<div class="info"><span>20min</span><span>⭐ 4.5</span></div>
<div class="price-row">
<span>₹120</span>
<button class="add" onclick="addItem('Burger',120,'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800&q=80')">+</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=800&q=80">
<div class="name">Egg Burger</div>
<div class="info"><span>20min</span><span>⭐ 4.5</span></div>
<div class="price-row">
<span>₹110</span>
<button class="add" onclick="addItem('Egg Burger',110,'https://images.unsplash.com/photo-1550547660-d9450f859349?w=800&q=80')">+</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1601924582975-7e7cba2c7a9d">
<div class="name">Pizza</div>
<div class="info"><span>25min</span><span>⭐ 4.7</span></div>
<div class="price-row">
<span>₹199</span>
<button class="add" onclick="addItem('Pizza',199,'https://images.unsplash.com/photo-1601924582975-7e7cba2c7a9d?w=800&q=80')">+</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1604908554027-23a90a3c1b63">
<div class="name">Fried Rice</div>
<div class="info"><span>15min</span><span>⭐ 4.3</span></div>
<div class="price-row">
<span>₹150</span>
<button class="add" onclick="addItem('Fried Rice',150,'https://images.unsplash.com/photo-1604908554027-23a90a3c1b63?w=800&q=80')">+</button>
</div>
</div>

</div>

<!-- CART BAR -->
<div class="cart-bar" id="cartBar" onclick="goToCart()">
<span id="count">0 items</span>
<span>View Cart</span>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

function addItem(name,price,img){
 if(cart[name]){
  cart[name].qty++;
 }else{
  cart[name]={price,qty:1,img};
 }

 localStorage.setItem("cart", JSON.stringify(cart));
 updateCart();
}

function updateCart(){
 let count=0;
 for(let i in cart){
  count+=cart[i].qty;
 }

 document.getElementById("count").innerText=count+" items";
 document.getElementById("cartBar").classList.add("show");
}

function goToCart(){
 window.location.href="cart.html";
}

/* SLIDER FIXED */
let index=0;
setInterval(()=>{
 index++;
 if(index>2) index=0;

 document.getElementById("slides").style.transform =
 "translateX(-"+index*100+"%)";
},3000); /* FIXED SPEED */

updateCart();
</script>

</body>
</html>
