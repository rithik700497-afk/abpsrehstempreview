<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Morning  ✨</title>

<style>

body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;

    background: linear-gradient(-45deg, 
        #ff9a9e, 
        #fad0c4, 
        #ffdde1, 
        #ff6f91, 
        #ffc3a0);

    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;

    height: 100vh;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Gradient Animation */
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Login Box */
#loginBox {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: pop 1s ease;
}

input {
    padding: 12px;
    border-radius: 12px;
    border: 2px solid pink;
    outline: none;
    margin-top: 10px;
    width: 200px;
}

/* Modern Button */
button {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ff6f91,#ff3f6c);
    color: white;
    cursor: pointer;
    margin-top: 18px;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

/* Main Content */
#mainContent {
    display: none;
    text-align: center;
    color: white;
    animation: fadeIn 2s ease;
}

/* Floating Photo */
img {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid white;
    margin-top: 20px;
    animation: float 3s infinite ease-in-out;
}

h1 {
    font-size: 42px;
    animation: glow 2s infinite alternate;
}

p {
    max-width: 520px;
    margin: 20px auto;
    font-size: 18px;
    line-height: 1.7;
    animation: fadeInUp 2s ease;
}

/* Floating Hearts */
.heart {
    position: absolute;
    color: white;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

/* Animations */
@keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeInUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes glow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 30px white; }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

</style>
</head>

<body>

<!-- Password Box -->
<div id="loginBox">
    <h2>Enter Password ✨</h2>
    <input type="password" id="password" placeholder="Password daalo  ✨">
    <br>
    <button onclick="checkPass()">Unlock 🔓</button>
</div>

<!-- Main Content -->
<div id="mainContent">
    <h1>Happiest Birthday Nandani🌙✨</h1>

    <img src="photo3.jpg" alt="Her Photo">

    <p>
        Happy Birthday, Nandani! 🎂✨<br><br>
        Meri pyaari chotu behen,
        tu hamesha hasi se ghar ko roshan karti rahe.
        Bhagwan kare teri har wish poori ho aur<br><br>
        teri life pink sky jaisi beautiful ho.” 💕🌸
    </p>

    <button onclick="againGN()">Happiest Birthday Nandaniiiiiii</button>

</div>

<script>

function checkPass() {
    var pass = document.getElementById("password").value;
    if(pass === "nandani") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        createHearts();
    } else {
        alert("Wrong Password 😒");
    }
}

function againGN() {
    alert("happiest Birthday Nandaniiiiiii ✨✨\n\n");
}

function createHearts() {
    setInterval(() => {
        var heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "✨";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }, 400);
}

</script>

</body>
</html>
