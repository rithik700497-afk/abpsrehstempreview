<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:'Poppins',sans-serif;
 background:linear-gradient(135deg,#ff3b3b,#ff914d);
 overflow:hidden;
 color:white;
 will-change:transform,opacity;
}

/* GLASS CARD */
.container{
 text-align:center;
 padding:30px;
 border-radius:25px;
 backdrop-filter:blur(10px);
 background:rgba(255,255,255,0.1);
 box-shadow:0 10px 30px rgba(0,0,0,0.2);
 transform:translateY(20px);
 opacity:0;
 animation:fadeUp 1s ease forwards;
}

/* LOGO */
.logo{
 font-size:75px;
 animation:float 3s ease-in-out infinite;
}

/* TITLE */
.title{
 font-size:28px;
 font-weight:700;
 margin-top:10px;
 letter-spacing:1px;
}

/* SUBTITLE */
.subtitle{
 font-size:14px;
 opacity:0.9;
 margin-top:5px;
}

/* TAGLINE */
.tag{
 margin-top:15px;
 font-size:15px;
 opacity:0;
 animation:fade 1s ease forwards;
 animation-delay:1s;
}

/* LOADER */
.loader{
 width:200px;
 height:4px;
 background:rgba(255,255,255,0.3);
 border-radius:10px;
 margin:25px auto;
 overflow:hidden;
}

.progress{
 height:100%;
 width:0%;
 background:white;
 animation:load 2.2s ease forwards;
}

/* ANIMATIONS */
@keyframes fadeUp{
 to{
  transform:translateY(0);
  opacity:1;
 }
}

@keyframes float{
 0%,100%{ transform:translateY(0); }
 50%{ transform:translateY(-10px); }
}

@keyframes fade{
 to{ opacity:1; }
}

@keyframes load{
 to{ width:100%; }
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🍔</div>

<div class="title">Smart Restro</div>

<div class="subtitle">Scan • Order • Enjoy</div>

<div class="tag">QR Table Ordering System 🚀</div>

<div class="loader">
<div class="progress"></div>
</div>

</div>

<script>
// smooth fade + redirect
setTimeout(()=>{
 document.body.style.opacity="0";
 document.body.style.transition="0.5s";
 setTimeout(()=>{
  window.location.href="frontend.html";
 },500);
},2500);
</script>

</body>
</html>
