
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bestie</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:sans-serif;
}

/* Photo animation */
img{
    width:90%;
    max-width:600px;
    border-radius:15px;
    box-shadow:0 0 40px rgba(255,255,255,0.3);
    animation: zoom 6s infinite alternate;
}

/* Zoom effect */
@keyframes zoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.1);
    }
}

/* Text */
h1{
    position:absolute;
    top:30px;
    color:white;
    font-size:35px;
    letter-spacing:2px;
    text-shadow:0 0 10px pink;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px pink;
    }
    to{
        text-shadow:0 0 25px red;
    }
}

</style>
</head>

<body>

<h1>Cutieeeee ✨</h1>

<img src="photo2.jpg">

</body>
</html>
