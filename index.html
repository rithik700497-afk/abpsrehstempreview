<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shivaksha Restro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 font-family:'Poppins',sans-serif;
 background:#0f0f1a;
 color:white;
}

/* SPLASH */
#splash{
 position:fixed;
 width:100%;
 height:100vh;
 background:linear-gradient(135deg,#ff3b3b,#1a1a2e);
 display:flex;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 z-index:999;
 animation:fadeOut 1s ease 2.5s forwards;
}
.logo{
 width:110px;

 animation:pop 0.8s ease;
}
@keyframes pop{
 from{transform:scale(0);}
 to{transform:scale(1);}
}
@keyframes fadeOut{
 to{opacity:0;visibility:hidden;}
}

/* HEADER */
.header{
 text-align:center;
 padding:15px;
 background:#1a1a2e;
 position:sticky;
 top:0;
}

/* TABLE */
.table{
 text-align:center;
 color:#aaa;
 margin-top:5px;
}

/* SEARCH */
.search{
 padding:10px;
}
.search input{
 width:95%;
 padding:12px;
 border-radius:15px;
 border:none;
 outline:none;
}

/* CATEGORY */
.categories{
 display:flex;
 overflow-x:auto;
 gap:10px;
 padding:10px;
}
.categories button{
 padding:8px 15px;
 border-radius:20px;
 border:none;
 background:#2c2c54;
 color:white;
 cursor:pointer;
}

/* CARD */
.card{
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#1a1a2e;
 margin:12px;
 padding:12px;
 border-radius:15px;
 gap:10px;
 transition:0.3s;
}
.card:hover{ transform:scale(1.03); }

.info{
 flex:1;
 display:flex;
 flex-direction:column;
 gap:4px;
}

.card img{
 width:75px;
 height:75px;
 border-radius:50%;
 object-fit:cover;
}

/* BADGE */
.badge{
 font-size:11px;
 padding:3px 8px;
 border-radius:10px;
}
.available{ background:#2ecc71; }
.not{ background:#e74c3c; }

/* BUTTON */
.order button{
 background:linear-gradient(45deg,#ff3b3b,#ff6b6b);
 border:none;
 padding:8px 14px;
 color:white;
 border-radius:10px;
 cursor:pointer;
 transition:0.3s;
}
.order button:hover{
 transform:scale(1.08);
}
.order button:disabled{
 background:gray;
 cursor:not-allowed;
}

/* CART BAR */
.cart-bar{
 position:fixed;
 bottom:0;
 width:100%;
 background:#ff3b3b;
 padding:12px;
 display:none;
 justify-content:space-between;
 align-items:center;
}

/* CART PAGE */
#cartPage{
 position:fixed;
 top:0;
 width:100%;
 height:100%;
 background:#0f0f1a;
 display:none;
 overflow:auto;
}
.cart-item{
 padding:10px;
 border-bottom:1px solid gray;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="https://cdn-icons-png.flaticon.com/512/5787/5787016.png" class="logo">
<h1>Shivaksha Restro</h1>
<p style="opacity:0.8;">Delicious Food Experience 🍔</p>
</div>

<div class="header">🍽 Shivaksha Restro</div>
<div class="table">Table No: <span id="tableNo"></span></div>

<div class="search">
<input type="text" placeholder="Search food..." onkeyup="searchFood()">
</div>

<div class="categories">
<button onclick="filter('all')">All</button>
<button onclick="filter('north')">North Indian</button>
<button onclick="filter('fast')">Fast Food</button>
<button onclick="filter('chinese')">Chinese</button>
</div>

<div id="menu">

<!-- ITEM -->
<div class="card fast">
<div class="info">
<span class="badge available">Available</span>
<h3>Burger</h3>
<p>₹120</p>
</div>
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop">
<div class="order">
<button onclick="addToCart('Burger',120)">ADD</button>
</div>
</div>

<div class="card fast">
<div class="info">
<span class="badge available">Available</span>
<h3>Pizza</h3>
<p>₹199</p>
</div>
<img src="https://images.unsplash.com/photo-1601924582975-7e7cba2c7a9d?q=80&w=800&auto=format&fit=crop">
<div class="order">
<button onclick="addToCart('Pizza',199)">ADD</button>
</div>
</div>

<div class="card north">
<div class="info">
<span class="badge available">Available</span>
<h3>Paneer Butter Masala</h3>
<p>₹180</p>
</div>
<img src="https://images.unsplash.com/photo-1631452180519-c014fe946bc7?q=80&w=800&auto=format&fit=crop">
<div class="order">
<button onclick="addToCart('Paneer Butter Masala',180)">ADD</button>
</div>
</div>

<div class="card chinese">
<div class="info">
<span class="badge available">Available</span>
<h3>Fried Rice</h3>
<p>₹150</p>
</div>
<img src="https://images.unsplash.com/photo-1604908554027-23a90a3c1b63?q=80&w=800&auto=format&fit=crop">
<div class="order">
<button onclick="addToCart('Fried Rice',150)">ADD</button>
</div>
</div>

<div class="card north">
<div class="info">
<span class="badge not">Not Available</span>
<h3>Kadai Paneer</h3>
<p>₹170</p>
</div>
<img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?q=80&w=800&auto=format&fit=crop">
<div class="order">
<button disabled>ADD</button>
</div>
</div>

</div>

<!-- CART -->
<div class="cart-bar" id="cartBar">
<span id="count">0 items</span>
<button onclick="openCart()">View Cart</button>
</div>

<div id="cartPage">
<h2 style="padding:10px;">Your Cart</h2>
<div id="cartItems"></div>
<h3 id="total" style="padding:10px;"></h3>
<button onclick="placeOrder()" style="margin:10px;">Place Order</button>
</div>

<script>
let params=new URLSearchParams(window.location.search);
let table=params.get("table")||"1";
document.getElementById("tableNo").innerText=table;

let cart=[];

function addToCart(name,price){
 cart.push({name,price});
 document.getElementById("cartBar").style.display="flex";
 document.getElementById("count").innerText=cart.length+" items";
}

function openCart(){
 let div=document.getElementById("cartItems");
 let total=0;
 div.innerHTML="";

 cart.forEach(i=>{
  div.innerHTML+=`<div class="cart-item">${i.name} - ₹${i.price}</div>`;
  total+=i.price;
 });

 document.getElementById("total").innerText="Total: ₹"+total;
 document.getElementById("cartPage").style.display="block";
}

function placeOrder(){
 let orders=JSON.parse(localStorage.getItem("orders"))||[];
 orders.push({table,items:cart});
 localStorage.setItem("orders",JSON.stringify(orders));
 alert("Order Sent to Kitchen!");
 location.reload();
}

function searchFood(){
 let input=document.querySelector("input").value.toLowerCase();
 document.querySelectorAll(".card").forEach(c=>{
  c.style.display=c.innerText.toLowerCase().includes(input)?"flex":"none";
 });
}

function filter(cat){
 document.querySelectorAll(".card").forEach(c=>{
  c.style.display=(cat==="all"||c.classList.contains(cat))?"flex":"none";
 });
}
</script>

</body>
</html>
